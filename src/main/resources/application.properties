spring.application.name=employee-leave-backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_leave?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Use a unique secret of at least 32 characters outside local demos.
app.jwt.secret=${JWT_SECRET:VGVzdFNlY3JldEtleUZvckxvY2FsRGV2ZWxvcG1lbnRPbmx5MTIzNDU2Nzg5MA==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
